name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fatturazione
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fatturazione
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - name: Controlli di sicurezza per la produzione
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: chiave-di-prova-per-il-controllo-di-deploy-lunga-almeno-cinquanta-caratteri
        run: python manage.py check --deploy --fail-level WARNING
